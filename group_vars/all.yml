lab_prefix: g2-
lab_dir: /var/lib/libvirt/images/itmo-g2
lab_domain: corp.internal
lab_user: ansible
lab_public_key_file: ''
lab_root_disk_gb: 12
lab_data_disk_gb: 5
lab_dns:
- 1.1.1.1
- 8.8.8.8
lab_monitoring_sources: []
lab_image_url: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-generic-amd64-20261103-2651.qcow2
lab_image_checksum: sha512:1207e6e3efaff8ee77ab7a32c156a3eea6a9e53f94cfc48efbd1f49ba554ca36ac62ab27395aa813a1775a8c0a393b1a1ce5377d9e5670f6113e3110c57fee4b
lab_networks:
- name: wan
  bridge: virbr-g2wan
  cidr: 172.30.2.0/24
  gateway: 172.30.2.1
- name: dc1
  bridge: virbr-g2dc1
  cidr: 10.22.1.0/24
  gateway: 10.22.1.1
- name: dc2
  bridge: virbr-g2dc2
  cidr: 10.22.2.0/24
  gateway: 10.22.2.1
- name: dc3
  bridge: virbr-g2dc3
  cidr: 10.22.3.0/24
  gateway: 10.22.3.1
lab_vms:
- name: g2-router
  role: router
  dc: wan
  ip: 172.30.2.2
  memory: 512
  vcpus: 1
  nics:
  - network: wan
    name: wan0
    ip: 172.30.2.2
    mac: '52:54:00:22:00:01'
  - network: dc1
    name: dc1
    ip: 10.22.1.1
    mac: '52:54:00:22:00:02'
  - network: dc2
    name: dc2
    ip: 10.22.2.1
    mac: '52:54:00:22:00:03'
  - network: dc3
    name: dc3
    ip: 10.22.3.1
    mac: '52:54:00:22:00:04'
  data_disks: 0
- name: g2-dc1
  role: clickhouse
  zookeeper: true
  zookeeper_id: 1
  dc: dc1
  ip: 10.22.1.10
  memory: 4096
  vcpus: 2
  nics:
  - network: dc1
    name: dc1
    ip: 10.22.1.10
    mac: '52:54:00:22:01:01'
  data_disks: 8
  clickhouse_instances:
  - name: ch1r1
    shard: 1
    replica: 1
    raid_level: 10
    tcp_port: 9000
    http_port: 8123
    interserver_port: 9009
    data_disks:
    - vdb
    - vdc
    - vdd
    - vde
  - name: ch3r2
    shard: 3
    replica: 2
    raid_level: 6
    tcp_port: 9001
    http_port: 8124
    interserver_port: 9010
    data_disks:
    - vdf
    - vdg
    - vdh
    - vdi
- name: g2-dc2
  role: clickhouse
  zookeeper: true
  zookeeper_id: 2
  dc: dc2
  ip: 10.22.2.10
  memory: 4096
  vcpus: 2
  nics:
  - network: dc2
    name: dc2
    ip: 10.22.2.10
    mac: '52:54:00:22:01:02'
  data_disks: 8
  clickhouse_instances:
  - name: ch1r2
    shard: 1
    replica: 2
    raid_level: 10
    tcp_port: 9000
    http_port: 8123
    interserver_port: 9009
    data_disks:
    - vdb
    - vdc
    - vdd
    - vde
  - name: ch2r1
    shard: 2
    replica: 1
    raid_level: 5
    tcp_port: 9001
    http_port: 8124
    interserver_port: 9010
    data_disks:
    - vdf
    - vdg
    - vdh
    - vdi
- name: g2-dc3
  role: clickhouse
  zookeeper: true
  zookeeper_id: 3
  dc: dc3
  ip: 10.22.3.10
  memory: 4096
  vcpus: 2
  nics:
  - network: dc3
    name: dc3
    ip: 10.22.3.10
    mac: '52:54:00:22:01:03'
  data_disks: 8
  clickhouse_instances:
  - name: ch2r2
    shard: 2
    replica: 2
    raid_level: 5
    tcp_port: 9000
    http_port: 8123
    interserver_port: 9009
    data_disks:
    - vdb
    - vdc
    - vdd
    - vde
  - name: ch3r1
    shard: 3
    replica: 1
    raid_level: 6
    tcp_port: 9001
    http_port: 8124
    interserver_port: 9010
    data_disks:
    - vdf
    - vdg
    - vdh
    - vdi
- name: g2-load
  role: load
  dc: dc1
  ip: 10.22.1.30
  memory: 512
  vcpus: 1
  nics:
  - network: dc1
    name: dc1
    ip: 10.22.1.30
    mac: '52:54:00:22:00:28'
  data_disks: 0
lab_team_public_keys:
- '{{ lookup(''file'', playbook_dir + ''/keys/team/MacBook-Pro.pub'') }}'
