- '{{ lookup(''file'', playbook_dir + ''/keys/team/Kirill.pub'') }}'
- '{{ lookup(''file'', playbook_dir + ''/keys/team/Danila.pub'') }}'
- '{{ lookup(''file'', playbook_dir + ''/keys/team/Daniil.pub'') }}'
