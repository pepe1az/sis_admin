---
- name: Install routing tools
  ansible.builtin.apt:
    name: [nftables, iproute2]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Persist IPv4 forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-itmo-router.conf
    content: "net.ipv4.ip_forward=1\n"
    mode: '0644'
- name: Read current forwarding setting
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: router_forwarding
  changed_when: false
- name: Enable IPv4 forwarding
  ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
  when: router_forwarding.stdout != '1'
  changed_when: true
- name: Configure router firewall and WAN NAT
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s
  notify: Reload router nftables
- name: Enable router firewall
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
- name: Apply forwarding rules before provisioning guests
  ansible.builtin.meta: flush_handlers
- name: Install timed chaos runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/chaos.py"
    dest: /usr/local/sbin/g2-chaos
    mode: '0755'
- name: Install chaos topology
  ansible.builtin.copy:
    dest: /etc/itmo-g2-topology.json
    content: "{{ {'networks': lab_networks, 'vms': lab_vms} | to_nice_json }}"
    mode: '0644'
